[project]
name = "roll_master"
authors = [{ name = "Apnemy Technologies", email = "ap@apnemy.com" }]
description = "Roll-wise fabric receipt, issue and stock reporting for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
